services:
  - type: web
    runtime: python
    name: digital-twin
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: GEMINI_API_KEY
        sync: false
      - key: SUMMARY_TEXT
        sync: false
      - key: LINKEDIN_TEXT
        sync: false
